name: memoria-digital-produccion

# Producción en la VM: el frontend vive en Vercel, que reenvía /api y /docs a este Caddy.
# Lee los valores de deploy/.env (copiar de deploy/.env.example); sin un valor obligatorio no arranca.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-memoria_digital}
    # sin puertos publicados: solo el backend llega a la base, por la red interna
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mda} -d ${POSTGRES_DB:-memoria_digital}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ../backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mda}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-memoria_digital}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?falta JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?falta PUBLIC_WEB_URL}
      STORAGE_DIR: /app/storage
      ASISTENTE_PROVEEDOR: ${ASISTENTE_PROVEEDOR:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASISTENTE_MODELO: ${ASISTENTE_MODELO:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?falta SEED_ADMIN_PASSWORD}
      SEED_PERSONAL_PASSWORD: ${SEED_PERSONAL_PASSWORD:?falta SEED_PERSONAL_PASSWORD}
      SEED_REVISORA_PASSWORD: ${SEED_REVISORA_PASSWORD:?falta SEED_REVISORA_PASSWORD}
      SEED_PUBLICO_PASSWORD: ${SEED_PUBLICO_PASSWORD:?falta SEED_PUBLICO_PASSWORD}
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  db_data:
  storage_data:
  caddy_data:
  caddy_config:
