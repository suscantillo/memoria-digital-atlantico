<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 510" width="1230" height="510" font-family="Liberation Sans, Arial, sans-serif"><rect width="1230" height="510" fill="#fff"/><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f5871"/></marker></defs><circle cx="135.0" cy="34" r="15" fill="#3d4f63" stroke="#1d2b3a"/><rect x="40" y="46" width="190" height="92" rx="18" fill="#3d4f63" stroke="#1d2b3a"/><text x="135.0" y="70" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Visitante y público</text><text x="135.0" y="86" font-size="10" fill="#c9d3de" text-anchor="middle">[Persona]</text><text x="135.0" y="104" font-size="10.5" fill="#fff" text-anchor="middle">Navegador o celular</text><text x="135.0" y="118" font-size="10.5" fill="#fff" text-anchor="middle">que escanea el QR</text><circle cx="135.0" cy="300" r="15" fill="#3d4f63" stroke="#1d2b3a"/><rect x="40" y="312" width="190" height="92" rx="18" fill="#3d4f63" stroke="#1d2b3a"/><text x="135.0" y="336" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Personal y administrador</text><text x="135.0" y="352" font-size="10" fill="#c9d3de" text-anchor="middle">[Persona]</text><text x="135.0" y="370" font-size="10.5" fill="#fff" text-anchor="middle">Navegador en el</text><text x="135.0" y="384" font-size="10.5" fill="#fff" text-anchor="middle">archivo</text><rect x="300" y="20" width="900" height="470" rx="10" fill="none" stroke="#3f5871" stroke-dasharray="6 4"/><text x="316" y="42" font-size="12" fill="#66758a" text-anchor="start" font-weight="700">Memoria Digital del Atlántico [docker compose]</text><rect x="340" y="70" width="250" height="110" rx="6" fill="#1f5f8b" stroke="#1d2b3a" stroke-width="1.1"/><text x="465.0" y="92" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">Aplicación web</text><text x="465.0" y="108" font-size="10.5" fill="#d6e4ef" text-anchor="middle">[React 18, Vite, MUI 6]</text><text x="465.0" y="126" font-size="11" fill="#fff" text-anchor="middle">SPA: portal público</text><text x="465.0" y="141" font-size="11" fill="#fff" text-anchor="middle">y panel del personal.</text><text x="465.0" y="156" font-size="11" fill="#fff" text-anchor="middle">Corre en el navegador.</text><rect x="340" y="300" width="250" height="120" rx="6" fill="#1f5f8b" stroke="#1d2b3a" stroke-width="1.1"/><text x="465.0" y="322" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">frontend</text><text x="465.0" y="338" font-size="10.5" fill="#d6e4ef" text-anchor="middle">[Contenedor: nginx 1.27]</text><text x="465.0" y="356" font-size="11" fill="#fff" text-anchor="middle">Sirve la SPA y reenvía</text><text x="465.0" y="371" font-size="11" fill="#fff" text-anchor="middle">/api y /docs a la API.</text><text x="465.0" y="386" font-size="11" fill="#fff" text-anchor="middle">Puerto 5173.</text><rect x="690" y="180" width="250" height="128" rx="6" fill="#1f5f8b" stroke="#1d2b3a" stroke-width="1.1"/><text x="815.0" y="202" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">backend</text><text x="815.0" y="218" font-size="10.5" fill="#d6e4ef" text-anchor="middle">[Contenedor: NestJS 10, Node 22]</text><text x="815.0" y="236" font-size="11" fill="#fff" text-anchor="middle">API REST /api/v1 y</text><text x="815.0" y="251" font-size="11" fill="#fff" text-anchor="middle">Swagger en /docs. Al arrancar</text><text x="815.0" y="266" font-size="11" fill="#fff" text-anchor="middle">migra y siembra. Puerto 3000.</text><rect x="990" y="70" width="180" height="110" rx="6" fill="#2e6b4f" stroke="#1d2b3a" stroke-width="1.1"/><text x="1080.0" y="92" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">db</text><text x="1080.0" y="108" font-size="10.5" fill="#cfe6da" text-anchor="middle">[Contenedor: PostgreSQL 16]</text><text x="1080.0" y="126" font-size="11" fill="#fff" text-anchor="middle">Datos del sistema.</text><text x="1080.0" y="141" font-size="11" fill="#fff" text-anchor="middle">Volumen db_data.</text><rect x="990" y="320" width="180" height="110" rx="6" fill="#2e6b4f" stroke="#1d2b3a" stroke-width="1.1"/><text x="1080.0" y="342" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">storage_data</text><text x="1080.0" y="358" font-size="10.5" fill="#cfe6da" text-anchor="middle">[Volumen de Docker]</text><text x="1080.0" y="376" font-size="11" fill="#fff" text-anchor="middle">Archivos escaneados</text><text x="1080.0" y="391" font-size="11" fill="#fff" text-anchor="middle">en /app/storage.</text><path d="M230,80 L338,110" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><path d="M230,346 L300,346 L300,150 L338,150" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="236" y="250" font-size="10.5" fill="#66758a" text-anchor="start">usan [HTTP]</text><path d="M465,180 L465,298" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="473" y="236" font-size="10.5" fill="#66758a" text-anchor="start">se descarga de</text><text x="473" y="249" font-size="10.5" fill="#66758a" text-anchor="start">y llama a /api</text><path d="M590,360 L640,360 L640,260 L688,260" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="600" y="380" font-size="10.5" fill="#66758a" text-anchor="start">reenvía /api y /docs</text><text x="600" y="393" font-size="10.5" fill="#66758a" text-anchor="start">[HTTP, JSON]</text><path d="M940,215 L965,215 L965,125 L988,125" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="952" y="108" font-size="10.5" fill="#66758a" text-anchor="end">lee y escribe</text><text x="952" y="121" font-size="10.5" fill="#66758a" text-anchor="end">[Prisma, SQL]</text><path d="M940,275 L965,275 L965,375 L988,375" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="952" y="396" font-size="10.5" fill="#66758a" text-anchor="end">guarda y lee</text><text x="952" y="409" font-size="10.5" fill="#66758a" text-anchor="end">[sistema de archivos]</text></svg>
