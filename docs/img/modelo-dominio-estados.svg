<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" font-family="Liberation Sans, Arial, sans-serif"><rect width="1040" height="430" fill="#fff"/><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f5871"/></marker></defs><text x="30" y="28" font-size="14" fill="#1d2b3a" text-anchor="start" font-weight="700">Pieza</text><circle cx="46" cy="79" r="7" fill="#1d2b3a"/><path d="M54,79 L98,79" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><rect x="100" y="60" width="150" height="38" rx="19" fill="#eaf2f8" stroke="#3f5871" stroke-width="1.3"/><text x="175.0" y="84" font-size="12" fill="#1d2b3a" text-anchor="middle" font-weight="700" font-family="Liberation Mono, monospace">REGISTRADA</text><rect x="420" y="60" width="150" height="38" rx="19" fill="#eaf2f8" stroke="#3f5871" stroke-width="1.3"/><text x="495.0" y="84" font-size="12" fill="#1d2b3a" text-anchor="middle" font-weight="700" font-family="Liberation Mono, monospace">ESCANEADA</text><rect x="760" y="60" width="150" height="38" rx="19" fill="#eaf2f8" stroke="#3f5871" stroke-width="1.3"/><text x="835.0" y="84" font-size="12" fill="#1d2b3a" text-anchor="middle" font-weight="700" font-family="Liberation Mono, monospace">PUBLICADA</text><rect x="590" y="170" width="150" height="38" rx="19" fill="#f3f5f8" stroke="#b9c3cf" stroke-width="1.3"/><text x="665.0" y="194" font-size="12" fill="#66758a" text-anchor="middle" font-weight="700" font-family="Liberation Mono, monospace">REVISADA</text><path d="M250,72 L418,72" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="335" y="64" font-size="11" fill="#66758a" text-anchor="middle">se carga un escaneo</text><path d="M420,88 L252,88" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="335" y="106" font-size="11" fill="#66758a" text-anchor="middle">el escaneo se rechaza</text><path d="M570,79 L758,79" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="664" y="71" font-size="11" fill="#66758a" text-anchor="middle">el escaneo se aprueba</text><text x="665" y="226" font-size="10.5" fill="#66758a" text-anchor="middle" font-style="italic">Definido en el tipo; el flujo actual no pasa por él (decisión 16).</text><path d="M30,246 H1010" stroke="#b9c3cf"/><text x="30" y="276" font-size="14" fill="#1d2b3a" text-anchor="start" font-weight="700">ArchivoDigital</text><circle cx="46" cy="339" r="7" fill="#1d2b3a"/><path d="M54,339 L98,339" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><rect x="100" y="320" width="150" height="38" rx="19" fill="#eaf2f8" stroke="#3f5871" stroke-width="1.3"/><text x="175.0" y="344" font-size="12" fill="#1d2b3a" text-anchor="middle" font-weight="700" font-family="Liberation Mono, monospace">EN_REVISION</text><rect x="520" y="286" width="150" height="38" rx="19" fill="#eaf2f8" stroke="#3f5871" stroke-width="1.3"/><text x="595.0" y="310" font-size="12" fill="#1d2b3a" text-anchor="middle" font-weight="700" font-family="Liberation Mono, monospace">APROBADO</text><rect x="520" y="360" width="150" height="38" rx="19" fill="#eaf2f8" stroke="#3f5871" stroke-width="1.3"/><text x="595.0" y="384" font-size="12" fill="#1d2b3a" text-anchor="middle" font-weight="700" font-family="Liberation Mono, monospace">RECHAZADO</text><path d="M250,332 L380,332 L380,305 L518,305" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="386" y="298" font-size="11" fill="#66758a" text-anchor="start">aprobar(): tres criterios</text><path d="M250,346 L380,346 L380,379 L518,379" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="386" y="396" font-size="11" fill="#66758a" text-anchor="start">rechazar(): con motivo</text><text x="700" y="310" font-size="11" fill="#66758a" text-anchor="start">la pieza queda PUBLICADA</text><text x="700" y="384" font-size="11" fill="#66758a" text-anchor="start">la pieza vuelve a REGISTRADA</text><text x="100" y="382" font-size="10.5" fill="#66758a" text-anchor="start" font-style="italic">asignarRevisor() no cambia el estado.</text></svg>
