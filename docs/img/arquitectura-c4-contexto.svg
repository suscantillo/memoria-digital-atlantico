<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 456" width="1020" height="456" font-family="Liberation Sans, Arial, sans-serif"><rect width="1020" height="456" fill="#fff"/><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f5871"/></marker></defs><circle cx="135.0" cy="34" r="15" fill="#3d4f63" stroke="#1d2b3a"/><rect x="40" y="46" width="190" height="92" rx="18" fill="#3d4f63" stroke="#1d2b3a"/><text x="135.0" y="70" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Visitante</text><text x="135.0" y="86" font-size="10" fill="#c9d3de" text-anchor="middle">[Persona]</text><text x="135.0" y="104" font-size="10.5" fill="#fff" text-anchor="middle">Busca y consulta</text><text x="135.0" y="118" font-size="10.5" fill="#fff" text-anchor="middle">piezas publicadas</text><circle cx="385.0" cy="34" r="15" fill="#3d4f63" stroke="#1d2b3a"/><rect x="290" y="46" width="190" height="92" rx="18" fill="#3d4f63" stroke="#1d2b3a"/><text x="385.0" y="70" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Usuario público</text><text x="385.0" y="86" font-size="10" fill="#c9d3de" text-anchor="middle">[Persona]</text><text x="385.0" y="104" font-size="10.5" fill="#fff" text-anchor="middle">Visitante con cuenta:</text><text x="385.0" y="118" font-size="10.5" fill="#fff" text-anchor="middle">lee los PDF</text><circle cx="635.0" cy="34" r="15" fill="#3d4f63" stroke="#1d2b3a"/><rect x="540" y="46" width="190" height="92" rx="18" fill="#3d4f63" stroke="#1d2b3a"/><text x="635.0" y="70" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Personal del archivo</text><text x="635.0" y="86" font-size="10" fill="#c9d3de" text-anchor="middle">[Persona]</text><text x="635.0" y="104" font-size="10.5" fill="#fff" text-anchor="middle">Registra, escanea</text><text x="635.0" y="118" font-size="10.5" fill="#fff" text-anchor="middle">y revisa piezas</text><circle cx="885.0" cy="34" r="15" fill="#3d4f63" stroke="#1d2b3a"/><rect x="790" y="46" width="190" height="92" rx="18" fill="#3d4f63" stroke="#1d2b3a"/><text x="885.0" y="70" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Administrador</text><text x="885.0" y="86" font-size="10" fill="#c9d3de" text-anchor="middle">[Persona]</text><text x="885.0" y="104" font-size="10.5" fill="#fff" text-anchor="middle">Asigna revisores y</text><text x="885.0" y="118" font-size="10.5" fill="#fff" text-anchor="middle">administra cuentas</text><path d="M135,140 L135,200 L375.0,200 L375.0,270" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="143" y="165" font-size="10.5" fill="#66758a" text-anchor="start">consulta</text><text x="143" y="178" font-size="10.5" fill="#66758a" text-anchor="start">el portal</text><path d="M385,140 L385,200 L465.0,200 L465.0,270" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="393" y="165" font-size="10.5" fill="#66758a" text-anchor="start">lee los</text><text x="393" y="178" font-size="10.5" fill="#66758a" text-anchor="start">documentos</text><path d="M635,140 L635,200 L555.0,200 L555.0,270" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="643" y="165" font-size="10.5" fill="#66758a" text-anchor="start">usa</text><text x="643" y="178" font-size="10.5" fill="#66758a" text-anchor="start">el panel</text><path d="M885,140 L885,200 L645.0,200 L645.0,270" stroke="#3f5871" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/><text x="893" y="165" font-size="10.5" fill="#66758a" text-anchor="start">administra</text><text x="893" y="178" font-size="10.5" fill="#66758a" text-anchor="start">el panel</text><rect x="290" y="270" width="440" height="112" rx="6" fill="#1f5f8b" stroke="#1d2b3a" stroke-width="1.1"/><text x="510.0" y="292" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">Memoria Digital del Atlántico</text><text x="510.0" y="308" font-size="10.5" fill="#d6e4ef" text-anchor="middle">[Sistema de software]</text><text x="510.0" y="326" font-size="11" fill="#fff" text-anchor="middle">Inventario del archivo, carga y control de calidad de</text><text x="510.0" y="341" font-size="11" fill="#fff" text-anchor="middle">escaneos, QR por pieza y portal público de consulta.</text><text x="510" y="420" font-size="11" fill="#66758a" text-anchor="middle" font-style="italic">En la entrega 1 el sistema no depende de sistemas externos: guarda sus archivos en un volumen propio</text><text x="510" y="436" font-size="11" fill="#66758a" text-anchor="middle" font-style="italic">y no envía correos ni consulta servicios de terceros.</text></svg>
