="#1d2b3a" stroke-width="1.6" fill="none"/><text x="1150" y="230" font-size="12" fill="#1d2b3a" text-anchor="middle" font-weight="700">Personal</text><circle cx="1150" cy="395" r="9" stroke="#1d2b3a" stroke-width="1.6" fill="none"/><path d="M1150,404 V429 M1136,414 H1164 M1150,429 L1139,447 M1150,429 L1161,447" stroke="#1d2b3a" stroke-width="1.6" fill="none"/><text x="1150" y="465" font-size="12" fill="#1d2b3a" text-anchor="middle" font-weight="700">Administrador</text><text x="625" y="576" font-size="11" fill="#66758a" text-anchor="middle">El usuario público hace todo lo del visitante, y el administrador todo lo del personal. Cada recuadro punteado agrupa los casos de un actor.</text></svg>
